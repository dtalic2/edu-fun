{# Reusable ad banner — include with: {% include 'ad_banner.html' %} #}
{# Requires 'ad' variable in context (may be None) #}
{% if ad and ad.is_active %}
<div style="background:#fffbeb; border:1px solid #fcd34d; border-radius:var(--radius); padding:1rem 1.25rem; margin:1.5rem 0; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:.75rem;">
  <div>
    <span style="font-size:.7rem; text-transform:uppercase; letter-spacing:.05em; color:#92400e; font-weight:700;">Sponsored · {{ ad.company_name }}</span>
    <div style="font-weight:700; font-size:1rem; margin:.2rem 0;">{{ ad.headline }}</div>
    {% if ad.body %}
      <div style="font-size:.85rem; color:var(--muted);">{{ ad.body }}</div>
    {% endif %}
  </div>
  <a href="{{ ad.cta_url or '#' }}" class="btn btn-accent btn-sm" style="flex-shrink:0;">{{ ad.cta_text }}</a>
</div>
{% endif %}
